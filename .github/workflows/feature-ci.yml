name: GitHub Actions Go CI
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push:
    branches: [feature/**]
  pull_request:
    branches: [feature/**]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install dependencies
        run: go mod tidy
      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test -cover ./...
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"